name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] && grep -q '\[project\]' pyproject.toml 2>/dev/null; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -e .
          fi
          pip install ruff pytest httpx2 setuptools

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest --tb=short -q
          else
            echo "No tests directory found, skipping pytest"
          fi

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omnibioai/omnibioai-hpc-policy-engine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Assert full OCI revision
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          test "${#FULL_SHA}" -eq 40
          test "$FULL_SHA" = "$(git rev-parse HEAD)"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify remote multiarch manifest
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -eu
          manifest=$(docker buildx imagetools inspect "ghcr.io/omnibioai/omnibioai-hpc-policy-engine:$FULL_SHA")
          echo "$manifest"
          echo "$manifest" | grep -q 'Platform:    linux/amd64'
          echo "$manifest" | grep -q 'Platform:    linux/arm64'
